
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab10 - jQuery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            line-height: 1.6;
        }

        .container {
            width: min(100% - 32px, 1000px);
            margin: 40px auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 15px;
        }

        .brand {
            color: #2563eb;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #eff6ff, #ffffff);
            border: 1px solid #dbeafe;
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
        }

        .tag {
            color: #2563eb;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 34px;
            margin: 12px 0;
        }

        .description {
            color: #64748b;
            max-width: 750px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
        }

        .section-title h2 {
            font-size: 23px;
        }

        #status {
            color: #64748b;
            font-size: 13px;
        }

        .exercise-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .exercise {
            background: white;
            border: 1px solid #e5eaf2;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .exercise:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .exercise h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .exercise p {
            color: #64748b;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .open-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .open-btn:hover {
            background: #1d4ed8;
        }

        .empty {
            grid-column: 1 / -1;
            background: white;
            padding: 25px;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            color: #64748b;
        }

        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 40px;
            padding-bottom: 20px;
        }

        @media (max-width: 650px) {
            .exercise-list {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 24px;
            }

            h1 {
                font-size: 27px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <nav class="topbar">
            <a class="brand" href="../">
                JAVASCRIPT LABS PORTFOLIO
            </a>

            <a class="back" href="../">
                ← Quay lại Portfolio
            </a>
        </nav>

        <section class="hero">
            <div class="tag">LAB 10 · CHAPTER 10</div>

            <h1>JavaScript 3: jQuery</h1>

            <p class="description">
                Bài thực hành giới thiệu thư viện jQuery,
                cách sử dụng Selectors, xử lý Events,
                thao tác DOM, tạo hiệu ứng và làm việc với dữ liệu.
            </p>
        </section>

        <section>
            <div class="section-title">
                <h2>Danh sách bài thực hành</h2>
                <span id="status">Đang tải...</span>
            </div>

            <div class="exercise-list" id="exerciseList"></div>
        </section>

        <footer>
            JavaScript Labs | Individual Assignment
        </footer>

    </main>

    <script>
        const prefix = "lab10-walkthrough";

        const candidates = Array.from(
            { length: 20 },
            (_, i) => prefix + String(i + 1).padStart(2, "0") + ".html"
        );

        const exerciseList = document.getElementById("exerciseList");
        const status = document.getElementById("status");

        async function checkFile(file) {
            try {
                const response = await fetch(file, {
                    method: "HEAD",
                    cache: "no-store"
                });

                return response.ok;
            } catch (error) {
                return false;
            }
        }

        function createExerciseCard(file) {
            const card = document.createElement("article");
            card.className = "exercise";

            const info = document.createElement("div");

            const heading = document.createElement("h3");
            heading.textContent =
                "Walkthrough " + file.match(/(\d+)\.html$/)[1];

            const description = document.createElement("p");
            description.textContent = file;

            const link = document.createElement("a");
            link.href = file;
            link.className = "open-btn";
            link.textContent = "Xem bài →";

            info.appendChild(heading);
            info.appendChild(description);

            card.appendChild(info);
            card.appendChild(link);

            exerciseList.appendChild(card);
        }

        async function loadExercises() {
            const results = await Promise.all(
                candidates.map(async file => ({
                    file: file,
                    exists: await checkFile(file)
                }))
            );

            const availableFiles = results.filter(item => item.exists);

            exerciseList.innerHTML = "";

            availableFiles.forEach(item => {
                createExerciseCard(item.file);
            });

            status.textContent =
                availableFiles.length + " trang HTML được tìm thấy";

            if (availableFiles.length === 0) {
                exerciseList.innerHTML =
                    '<div class="empty">Không tìm thấy file HTML. Vui lòng kiểm tra cấu trúc thư mục và tên file walkthrough.</div>';
            }
        }

        loadExercises();
    </script>

</body>
</html>
