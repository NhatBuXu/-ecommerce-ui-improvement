<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO App</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#202938;font:16px Arial,sans-serif}.shell{max-width:1050px;margin:36px auto;padding:0 20px}.header,.panel{background:#fff;border:1px solid #e2e7ef;border-radius:12px;padding:22px;margin-bottom:18px}.header{display:flex;justify-content:space-between;align-items:center;gap:18px}h1,h2,p{margin-top:0}h1{margin-bottom:6px}nav{display:flex;gap:8px}button,.nav-link{border:0;border-radius:7px;background:#2563eb;color:#fff;padding:10px 14px;font:inherit;cursor:pointer;text-decoration:none}.nav-link.active{background:#172554}.secondary{background:#64748b}.danger{background:#dc2626}.hidden{display:none!important}.form-grid,.filters,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}label{display:block;font-weight:600;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:78px;resize:vertical}.form-actions{display:flex;gap:8px;margin-top:12px}.filters{grid-template-columns:2fr 1fr}.task{border:1px solid #e2e7ef;border-radius:9px;padding:15px;margin-top:10px}.task-head{display:flex;justify-content:space-between;gap:12px}.task h3{margin:0 0 7px}.meta{color:#526174;font-size:14px}.badge{border-radius:20px;background:#e0e7ff;padding:5px 9px;white-space:nowrap;font-size:13px}.task-actions{display:flex;gap:7px;margin-top:12px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:#f1f5f9;padding:18px;border-radius:9px;text-align:center}.stat strong{display:block;font-size:27px;margin-top:7px}.notice{padding:10px;border-radius:7px;background:#eff6ff;color:#1d4ed8;margin-bottom:12px}.notice.error{background:#fef2f2;color:#b91c1c}.empty{color:#64748b;padding:15px 0}@media(max-width:650px){.header{align-items:flex-start;flex-direction:column}.form-grid,.filters,.stats{grid-template-columns:1fr}.field.full{grid-column:auto}.shell{margin:18px auto}}
  </style>
</head>
<body>
<main class="shell">
  <header class="header"><div><h1>TODO App</h1><p>Quản lý công việc cá nhân</p></div><nav><button class="nav-link active" data-page="tasks">Công việc</button><button class="nav-link" data-page="statistics">Thống kê</button></nav></header>
  <div id="notice" class="notice hidden" role="status"></div>
  <section id="tasksPage">
    <section class="panel"><h2 id="formHeading">Thêm công việc</h2><form id="taskForm"><div class="form-grid">
      <div class="field"><label for="title">Tiêu đề *</label><input id="title" maxlength="120" required></div>
      <div class="field"><label for="date">Ngày thực hiện *</label><input id="date" type="date" required></div>
      <div class="field full"><label for="description">Mô tả</label><textarea id="description" maxlength="1000"></textarea></div>
      <div class="field"><label for="priority">Ưu tiên</label><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
      <div class="field"><label for="status">Trạng thái</label><select id="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div>
    </div><div class="form-actions"><button id="submitButton">Thêm task</button><button id="cancelEdit" type="button" class="secondary hidden">Hủy sửa</button></div></form></section>
    <section class="panel"><h2>Task hôm nay <span id="todayLabel"></span></h2><div class="filters"><input id="search" placeholder="Tìm theo tiêu đề hoặc mô tả"><select id="filter"><option value="All">Tất cả trạng thái</option><option>Pending</option><option>In Progress</option><option>Completed</option></select></div><div id="taskList" aria-live="polite"></div></section>
  </section>
  <section id="statisticsPage" class="panel hidden"><h2>Thống kê task</h2><p>Số liệu được tính từ các task đang lưu trong JSON.</p><div class="stats"><div class="stat">Tổng task<strong id="total">0</strong></div><div class="stat">Completed<strong id="completed">0</strong></div><div class="stat">Pending<strong id="pending">0</strong></div><div class="stat">In Progress<strong id="inProgress">0</strong></div></div><p style="margin-top:16px">Tỷ lệ hoàn thành: <strong id="completionRate">0%</strong></p></section>
</main><script src="script.js"></script>
</body></html>
